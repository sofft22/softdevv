<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Soft Dev · Thanks</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #fff;
    color: #18181b;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }
  .card { max-width: 500px; text-align: center; }
  .icon {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #18181b;
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 36px;
  }
  h1 {
    font-size: 36px;
    font-weight: 600;
    letter-spacing: -0.035em;
    line-height: 1.1;
    color: #18181b;
    margin-bottom: 18px;
  }
  p { font-size: 16px; color: #52525b; margin-bottom: 14px; }
  .divider {
    height: 1px;
    background: #f4f4f5;
    margin: 40px auto;
    max-width: 220px;
  }
  .meta {
    font-size: 13.5px;
    color: #71717a;
    line-height: 1.7;
  }
  .meta strong { color: #18181b; font-weight: 600; }
  .brand {
    margin-top: 48px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: #18181b;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .brand-dot {
    width: 6px; height: 6px;
    background: #a84c69;
    border-radius: 50%;
    display: inline-block;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 13l4 4L19 7"/>
      </svg>
    </div>
    <h1>Got it.</h1>
    <p>Your brief landed. I'll review it and reply within one business day — check your email and WhatsApp.</p>
    <div class="divider"></div>
    <p class="meta">
      Phase 2 — payments, delivery, policies — comes <strong>right before launch</strong>.<br/>
      Nothing else needed from you right now.
    </p>
    <div class="brand"><span class="brand-dot"></span>Soft Dev</div>
  </div>
</body>
</html>
